<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manage profiles - Foldex</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="projects.css">
  <link rel="stylesheet" href="profiles.css">
  <script src="look.js" defer></script>
  <script src="menu.js" defer></script>
  <script src="buttons.js" defer></script>
  <script src="pane.js" defer></script>
  <script src="hostpane.js" defer></script>
  <script src="profilespane.js" defer></script>
</head>
<body class="pv-body">
  <div class="pv-head pv-grid pf-grid">
    <span>Name</span>
    <span>State</span>
    <span>Never open by itself</span>
    <span>Created</span>
    <span>Last opened</span>
  </div>
  <div class="pv-list" tabindex="0"></div>
  <footer class="pv-bottom">
    <span class="pv-count"></span>
    <button class="pf-open">Open</button>
    <button class="pf-copy">Copy...</button>
    <button class="pf-rename">Rename...</button>
    <button class="pf-password">Password...</button>
    <button class="pf-close" title="Close this profile: its windows close, its process ends">Close profile</button>
    <button class="pf-delete">Delete...</button>
  </footer>
</body>
</html>
