<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Settings - Foldex</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="settings.css">
  <script src="look.js" defer></script>
  <script src="settingrows.js" defer></script>
  <script src="settings.js" defer></script>
</head>
<body class="st-body">
  <header class="st-top">
    <input class="st-search" type="search" placeholder="Search settings" spellcheck="false" aria-label="Search settings">
  </header>
  <div class="st-problems" hidden></div>
  <main class="st-list"></main>
  <footer class="st-foot">
    A change applies at once in every Foldex window. Your settings file holds only what you changed:
    <button class="st-link" data-open="settings">open settings.json</button>
  </footer>
</body>
</html>
